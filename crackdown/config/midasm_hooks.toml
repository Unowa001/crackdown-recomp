# Co-op HDD gates (crackdown/src/hooks_storage.cpp). Each address is the
# `lbz rX,16282(rX)` that reads the HDD-cache flag 0x82DE3F9A, which the storage
# hook keeps clear so loaders stream from game:\. With co-op networking on,
# CrackdownCoopHdd_<address> reports "HDD present" to these menu checks only:
#   0x8265ADE4 sub_8265A738  Campaign "Play Now - Co-op" enable
#   0x82661C54 sub_82661B58  no-HDD popup (strings 380/664) before co-op
#   0x82678104 sub_82678010  no-HDD branch on the co-op menu path
# Loader readers 0x8253CA78/0x8253EE74 and XUI scene loading 0x82628A4C/
# 0x826298CC stay unhooked.

[[midasm_hook]]  # sub_8265A738
address = 0x8265ADE4
name = "CrackdownCoopHdd_8265ADE4"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]  # sub_82661B58
address = 0x82661C54
name = "CrackdownCoopHdd_82661C54"
registers = ["r11"]
after_instruction = true

