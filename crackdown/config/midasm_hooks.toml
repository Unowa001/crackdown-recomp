# Mid-asm hooks (SDK [[midasm_hook]]). Every entry cites why it exists.
# SDK v0.10.0, Default.xex sha256 7aaa7a89...7e5a
#
# Game ms clock (--sim_game_clock, crackdown/src/hooks_framerate.cpp).
# Each address is the `li rX,33` in the inlined per-frame ms choice
#   ms = [[0x82DE25C0]+13] ? 33 : ([0x82DE3FB0] ? [0x82D99228] : 16)
# (disassembly: `lbz ..,13(..); cmplwi; beq L; li rX,33; b ...`, so the li is
# at L - 8). The clock is always locked in retail, so these timers advance a
# fixed 33 ms per frame. After the li, CrackdownFrameMs_<address> puts the
# measured frame ms in the register (it leaves 33 when the cvar is off, or when
# the site's bit in --sim_game_clock_sites is clear; bits follow the order
# below, bit 0 = first entry). Unlocking the clock
# to use the game's own variable path broke physics (PC run crackdown_018).
# A 14th `li r5,33` at 0x8285CE30 (sub_8285CA20) is an unrelated enum value.

[[midasm_hook]]  # sub_82287130
address = 0x82287170
name = "CrackdownFrameMs_82287170"
registers = ["r11"]
after_instruction = true

